<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napló — Naptár</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="betoltes">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="leaf-decor leaf-tr" aria-hidden="true">🌿</div>
    <header class="topbar" id="topbar"></header>
    <div class="page-head">
      <div>
        <h1 class="page-title">Naptár <span class="leaf">🌿</span></h1>
        <p class="page-sub">Minden esemény egy helyen, napról napra.</p>
      </div>
      <div class="seg">
        <button class="active" data-nezet="honap">Hónap</button>
        <button data-nezet="nap">Nap</button>
      </div>
    </div>

    <!-- szűrők -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-5)">
      <button class="pill-btn active" data-szuro="osszes">Összes</button>
      <button class="pill-btn" data-szuro="edzes">🏋️ Edzés</button>
      <button class="pill-btn" data-szuro="tanc">💃 Tánc</button>
      <button class="pill-btn" data-szuro="merleg">⚖️ Mérleg</button>
      <button class="pill-btn" data-szuro="egyeb">🌿 Egyéb</button>
    </div>

    <!-- HÓNAP -->
    <div id="view-honap">
      <div class="card" style="margin-bottom:var(--space-5)">
        <div class="card-head">
          <div class="card-title" id="honapCim">—</div>
          <div class="seg"><button id="honapPrev">‹</button><button id="honapNext">›</button></div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>

    <!-- NAP -->
    <div id="view-nap" style="display:none">
      <div class="grid cols-2" style="margin-bottom:var(--space-5)">
        <div class="card">
          <div class="card-head"><div class="card-title" id="napCim">—</div></div>
          <div id="napIdovonal"></div>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title">Napi összegzés</div></div>
          <div class="grid cols-2" id="napRingek"></div>
        </div>
      </div>
    </div>

    <!-- ALSÓ SÁV -->
    <div class="grid cols-3">
      <div class="card"><div class="card-head"><div class="card-title">Havi aktivitás</div></div><div class="chart-box sm"><canvas id="haviAktivitas"></canvas></div></div>
      <div class="card"><div class="card-head"><div class="card-title">Aktivitás hőtérkép</div></div><div class="heat" id="hoterkep"></div>
        <div class="heat-legend"><span>kevés</span><span class="swatch" style="background:var(--sage-soft)"></span><span class="swatch" style="background:var(--sage)"></span><span>sok</span></div></div>
      <div class="card"><div class="card-head"><div class="card-title">Heti balansz</div></div><div class="chart-box sm"><canvas id="hetiBalansz"></canvas></div></div>
    </div>

  </main>
</div>
<script src="js/data.js"></script>
<script src="js/minta.js"></script>
<script src="js/charts.js"></script>
<script src="js/components.js"></script>
<script src="js/garden.js"></script>
<script src="js/pages/naptar.js"></script>
</body>
</html>
