<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napló — Egészség</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="betoltes">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="leaf-decor leaf-tr" aria-hidden="true">🌿</div>
    <header class="topbar" id="topbar"></header>
    <div class="page-head"><div>
      <h1 class="page-title">Egészség <span class="leaf">🌿</span></h1>
      <p class="page-sub">Kezeld testedet és figyelj a belső egyensúlyodra.</p>
    </div></div>

    <div class="tabs">
      <button class="active" data-tab="test">👤 Test</button>
      <button data-tab="tapl">🌿 Táplálkozás</button>
      <button data-tab="ciklus">🌸 Ciklus</button>
      <button data-tab="ossz">🧘 Összehangolás</button>
    </div>

    <!-- TEST -->
    <div class="tabpanel active" id="tab-test">
      <div class="grid cols-2" style="margin-bottom:var(--space-5)">
        <div class="card"><div class="card-head"><div class="card-title">Mai állapot</div></div><div class="tiles" id="testTiles"></div></div>
        <div class="card"><div class="card-head"><div class="card-title">Napi hangulat</div></div><div id="napiHangulat" style="display:flex;align-items:center;gap:16px"></div></div>
      </div>
      <div class="grid cols-3" style="margin-bottom:var(--space-5)">
        <div class="card span-2">
          <div class="card-head"><div class="card-title">Testsúly alakulása</div>
            <div class="seg"><button data-suly="7">7 nap</button><button data-suly="30" class="active">30 nap</button><button data-suly="90">90 nap</button></div></div>
          <div class="big-num" id="sulyFo" style="font-size:24px;margin-bottom:8px">—</div>
          <div class="chart-box"><canvas id="sulyChart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-head"><div class="card-title">Testösszetétel</div></div>
          <div id="testossz"></div>
          <p class="muted" id="bmiKat" style="font-size:12px;margin-top:6px"></p>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Testtrendek</div></div>
        <div class="chart-box"><canvas id="testtrendek"></canvas></div>
      </div>
    </div>

    <!-- TÁPLÁLKOZÁS -->
    <div class="tabpanel" id="tab-tapl">
      <div class="grid cols-2">
        <div class="card">
          <div class="card-head"><div class="card-title">Mai összesítés</div></div>
          <div id="makroWrap" style="display:flex;gap:20px;align-items:center">
            <div class="donut-wrap" style="width:160px;height:160px"><canvas id="makroChart"></canvas><div class="donut-center" id="makroCenter"></div></div>
            <div id="makroLegend" style="flex:1"></div>
          </div>
        </div>
        <div class="card"><div class="card-head"><div class="card-title">Heti összefoglaló</div></div><div class="tiles" id="hetiOssz"></div></div>
      </div>
    </div>

    <!-- CIKLUS -->
    <div class="tabpanel" id="tab-ciklus">
      <div class="card" style="max-width:420px">
        <div class="card-head"><div class="card-title">Ciklus</div></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
          <div id="ciklusKor"></div>
          <div class="page-title" id="ciklusFazis" style="font-size:28px">—</div>
          <div class="muted" id="ciklusSub"></div>
          <a class="pill-btn" href="naptar.html">Naptár megnyitása</a>
        </div>
      </div>
    </div>

    <!-- ÖSSZEHANGOLÁS -->
    <div class="tabpanel" id="tab-ossz">
      <div class="grid cols-3" style="margin-bottom:var(--space-5)">
        <div class="card"><div class="card-head"><div class="card-title">Célok a hétre</div></div><div id="celokHetre"></div></div>
        <div class="card">
          <div class="card-head"><div class="card-title">Kiemelt trend</div></div>
          <div class="muted" style="font-size:13px">Kalória egyensúly (napi − cél)</div>
          <div class="big-num" id="kiemeltFo" style="font-size:26px;margin:4px 0 8px">—</div>
          <div class="chart-box sm"><canvas id="kiemeltTrend"></canvas></div>
        </div>
        <div class="card"><div class="card-head"><div class="card-title">Megjegyzés</div></div><p id="megjegyzes" class="muted"></p></div>
      </div>
      <div class="card"><div class="card-head"><div class="card-title">Egyéb mutatók</div></div><div class="tiles" id="alvasEnergia" style="grid-template-columns:repeat(2,1fr)"></div></div>
    </div>

  </main>
</div>
<script src="js/data.js"></script>
<script src="js/minta.js"></script>
<script src="js/charts.js"></script>
<script src="js/components.js"></script>
<script src="js/garden.js"></script>
<script src="js/pages/egeszseg.js"></script>
</body>
</html>
