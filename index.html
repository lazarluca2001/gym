<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napló — Kezdőlap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="betoltes">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="leaf-decor leaf-tr" aria-hidden="true">🌿</div>
    <header class="topbar" id="topbar"></header>

    <div class="page-head">
      <div>
        <h1 class="page-title" id="koszones">Jó reggelt! <span class="leaf">🌿</span></h1>
        <p class="page-sub">Ma is tegyél magadért egy kicsit.</p>
      </div>
    </div>

    <!-- Mai fókusz -->
    <div class="card-title" style="margin-bottom:14px">Mai fókusz <span class="leaf">🌿</span></div>
    <div class="grid focus-5" style="margin-bottom:var(--space-5)">
      <div class="card tight"><div id="ringKal"></div></div>
      <div class="card tight"><div id="ringLep"></div></div>
      <div class="card tight"><div id="ringViz"></div></div>
      <div class="card tight"><div id="ringEdz"></div></div>
      <div class="card tight"><div id="ringTanc"></div></div>
    </div>

    <!-- Teendők + idővonal -->
    <div class="grid cols-2" style="margin-bottom:var(--space-5)">
      <div class="card">
        <div class="card-head"><div class="card-title">Mai teendők <span class="leaf">🌿</span></div><a class="card-action" href="naptar.html">+ Hozzáadás</a></div>
        <div id="teendok"></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Mai áttekintés <span class="leaf">🌿</span></div><a class="card-action" href="naptar.html">Napi összegzés →</a></div>
        <div id="idovonal"></div>
      </div>
    </div>

    <!-- Heti sorok -->
    <div class="grid cols-3" style="margin-bottom:var(--space-5)">
      <div class="card">
        <div class="card-head"><div class="card-title">Heti aktivitás <span class="leaf">🌿</span></div></div>
        <div class="chart-box sm"><canvas id="hetiAktivitas"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Heti célok <span class="leaf">🌿</span></div></div>
        <div id="hetiCelok"></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">Heti hangulat <span class="leaf">🌿</span></div><span class="big-num" id="hangulatAtlag">—</span></div>
        <div id="moodRow" style="margin-bottom:12px"></div>
        <div class="chart-box sm"><canvas id="hangulatChart"></canvas></div>
      </div>
    </div>

    <!-- Napi kertem -->
    <div class="garden">
      <div>
        <p class="quote"><span class="mark">„</span>A kitartás apró lépésekből áll, amelyeket nap mint nap megismételsz.</p>
        <p class="muted" id="kertUzenet" style="margin-top:14px"></p>
      </div>
      <div id="kertNagy"></div>
    </div>

  </main>
</div>
<script src="data.js"></script>
<script src="minta.js"></script>
<script src="charts.js"></script>
<script src="components.js"></script>
<script src="garden.js"></script>
<script src="kezdolap.js"></script>
</body>
</html>
