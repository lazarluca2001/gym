<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Napló</title>
<meta name="theme-color" content="#f5f2ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Napló">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{color:var(--ink);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:max(18px,calc(env(safe-area-inset-top) + 10px)) 14px calc(env(safe-area-inset-bottom,0px) + 110px);display:flex;flex-direction:column;gap:14px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:var(--ink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* fejléc */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .t{display:flex;flex-direction:column}
.top .dn{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1}
.top .dd{color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.navs{display:flex;gap:6px;align-items:center}
.circ{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.todaybtn{height:42px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.status{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--good)}

/* hét */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.sd .a{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.sd .b{font-family:var(--display);font-weight:700;font-size:17px}
.sd .dots{display:flex;gap:3px;height:7px}
.sd .dots i{width:7px;height:7px;border-radius:50%}
.sd.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sd.sel .a{color:inherit;opacity:.7}
.sd.today:not(.sel){border-color:var(--ink)}

/* terv sáv */
.plan{display:flex;align-items:center;gap:12px;background:var(--tint);border-radius:18px;padding:12px 14px}
.plan .ic{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;font-size:20px}
.plan b{display:block;font-family:var(--display);font-size:18px;letter-spacing:-.01em;color:var(--ink)}
.plan .s{display:block;font-size:13px;color:var(--muted)}

/* kártyák */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(40,30,10,.04)}
.chd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chd h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.chd h2 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chd .meta{font-size:13px;color:var(--muted);font-weight:600}
.empty{color:var(--muted);font-size:14px}
.add{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--c);color:var(--c);border-radius:99px;padding:9px 16px;font-weight:700;font-size:15px}
.pill{border-radius:99px;padding:9px 16px;font-weight:700;font-size:15px;background:var(--c);color:#fff}
.pill.out{background:transparent;color:var(--c);border:1.5px solid var(--c)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* lépés */
.steps{display:flex;align-items:center;gap:10px}
.steps input{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;border:1.5px solid var(--line);border-radius:16px;padding:8px 14px;background:var(--bg);width:100%}
.steps input:focus{outline:none;border-color:var(--c)}
.steps .of{font-size:14px;color:var(--muted);white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{background:var(--sunk);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}

/* tánc */
.dz{position:relative;border:1px solid var(--line);border-radius:16px;padding:12px 40px 12px 12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.dz .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.seg{display:inline-flex;background:var(--sunk);border-radius:99px;padding:3px}
.seg button{padding:6px 12px;border-radius:99px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--sunk);font-size:18px;font-weight:700}
.stepper b{font-family:var(--display);font-size:20px;min-width:58px;text-align:center}
.ints{display:inline-flex;gap:4px;align-items:center}
.ints small{font-size:12px;color:var(--muted);margin-right:4px}
.ints button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--c);color:var(--c);font-size:12px;font-weight:700}
.ints button.on{background:var(--c);color:#fff}
.dz input.note{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:14px;width:100%}
.x{color:var(--muted);font-size:15px;padding:4px 6px}
.dz [data-xd]{position:absolute;top:8px;right:6px}

/* edzés */
.tpls{display:flex;gap:8px;flex-wrap:wrap}
.tpl{flex:1;min-width:140px;text-align:left;border-radius:16px;padding:12px 14px;border:1.5px solid var(--line);background:var(--bg)}
.tpl b{display:block;font-family:var(--display);font-size:17px}
.tpl span{font-size:12px;color:var(--muted)}
.tpl.rec{border-color:var(--c);background:var(--tint)}
.tpl.rec b::after{content:" · mai terv";font-family:var(--body);font-size:12px;color:var(--c);font-weight:700}
.ex{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.ex .hd{display:flex;align-items:center;gap:8px}
.ex .hd b{flex:1;font-family:var(--display);font-size:17px}
.ex .cnt{font-size:12px;font-weight:700;color:var(--muted);background:var(--sunk);border-radius:99px;padding:2px 8px}
.ex .cnt.all{background:var(--c);color:#fff}
.ex .prev{font-size:12px;color:var(--muted)}
.set{display:grid;grid-template-columns:22px 1fr 12px 1fr 44px;gap:6px;align-items:center}
.set .n{font-size:12px;color:var(--muted);text-align:right}
.set label{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.set input{border:none;background:transparent;width:100%;min-width:0;font-family:var(--display);font-weight:700;font-size:18px;padding:8px 0;text-align:center;-moz-appearance:textfield;appearance:textfield}
.set input::-webkit-inner-spin-button,.set input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.set input:focus{outline:none}
.set label span{font-size:11px;color:var(--muted)}
.set .mul{color:var(--muted);text-align:center}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--c);color:transparent;font-size:20px;font-weight:800}
.chk[aria-pressed="true"]{background:var(--c);color:#fff}
.set.done label{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.ex .ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex .ft button.s{background:var(--sunk);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.ex .ft .rir{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700}
.ex .ft .rir input{width:52px;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;background:var(--surface)}
select.addex{border:1.5px dashed var(--c);color:var(--c);border-radius:99px;padding:9px 14px;font-weight:700;background:transparent;max-width:100%}

/* mentés jelző */
.saved{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;border-radius:99px;padding:6px 14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
.saved.on{opacity:1}

details.sync summary{cursor:pointer;font-weight:700}
.sync .f{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.sync label{font-size:12px;color:var(--muted);font-weight:600}
.sync input{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.sync .row{margin-top:10px}
.sync .msg{font-size:13px;color:var(--muted);margin:8px 0 0}
.btn{border-radius:99px;padding:9px 16px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filebtn{display:inline-block;cursor:pointer;border-radius:99px;padding:9px 16px;font-weight:700;border:1px solid var(--line)}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<script src="store.js"></script>
<script src="plan.js"></script>
<div class="saved" id="saved">Mentve ✓</div>
<div class="wrap">
  <div class="top">
    <div class="t"><span class="dn" id="dn"></span><span class="dd" id="dd"></span></div>
    <div class="navs">
      <button class="todaybtn" id="tod" hidden>Ma</button>
      <button class="circ" id="prev" aria-label="Előző nap">‹</button>
      <button class="circ" id="next" aria-label="Következő nap">›</button>
    </div>
  </div>
  <div class="strip" id="strip"></div>
  <div class="plan" id="plan"></div>

  <section class="card" style="--c:var(--steps)">
    <div class="chd"><h2><i></i>Lépés</h2><span class="meta" id="stmeta"></span></div>
    <div class="steps"><input id="stin" type="number" inputmode="numeric" min="0" max="80000" placeholder="0" aria-label="Lépésszám"><span class="of" id="stof"></span></div>
    <div class="bar"><i id="stbar" style="width:0"></i></div>
  </section>

  <section class="card" style="--c:var(--dance)">
    <div class="chd"><h2><i></i>Tánc</h2><span class="meta" id="dmeta"></span></div>
    <div id="dlist" style="display:flex;flex-direction:column;gap:10px"></div>
    <button class="add" id="dadd">+ Tánc hozzáadása</button>
  </section>

  <section class="card" style="--c:var(--gym)">
    <div class="chd"><h2><i></i>Edzés</h2><span class="meta" id="gmeta"></span></div>
    <div class="tpls" id="tpls"></div>
    <div id="exlist" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="row" id="gfoot"><select class="addex" id="addex" aria-label="Gyakorlat hozzáadása"></select></div>
  </section>

  <section class="card">
    <details class="sync" id="syncdetails">
      <summary>Adatok és szinkron</summary>
      <p class="msg"><span class="status" data-sync-status><i></i><span></span></span></p>
      <div class="f"><label for="s-url">Webes alkalmazás URL (Apps Script)</label><input id="s-url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div class="f"><label for="s-token">Titkos szó</label><input id="s-token" type="password" autocomplete="off"></div>
      <div class="row"><button class="btn p" id="s-save">Összekötés</button><button class="btn" id="s-now">Szinkron most</button><button class="btn" id="s-off">Leválasztás</button></div>
      <p class="msg" id="syncinfo"></p>
      <div class="row"><button class="btn" id="b-down">Biztonsági mentés</button><label class="filebtn">Visszatöltés<input type="file" id="b-up" accept=".json,application/json" hidden></label></div>
      <p class="msg" id="backupmsg"></p>
    </details>
  </section>
</div>
<script>
(function(){
  const P=window.PLAN, db=window.LocalDB.db;
  const $=id=>document.getElementById(id);
  const isNum=v=>typeof v==='number'&&isFinite(v);
  const toD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
  const HU=['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
  const HUs=['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
  const DN=['Vasárnap','Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat'], DS=['H','K','Sze','Cs','P','Szo','V'];
  const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
  const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
  const nf=n=>Math.round(n).toLocaleString('hu-HU');
  const kgTxt=v=>String(+v.toFixed(2)).replace('.',',');
  const hm=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
  const norm=s=>String(s||'').trim().toLowerCase();
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const numOr=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null};

  let steps={}, workouts={}, dances={}, prog={}, templates=P.templates();
  const q=new URLSearchParams(location.search);
  let sel=/^\d{4}-\d{2}-\d{2}$/.test(q.get('d')||'')?q.get('d'):iso(today());
  let ex=[], dz=[]; // a kiválasztott nap szerkesztett adatai

  // ---- mentés (automatikus) ----
  let tSave={};
  function flash(){const s=$('saved');s.classList.add('on');clearTimeout(flash.t);flash.t=setTimeout(()=>s.classList.remove('on'),1100)}
  function later(key,fn,ms=600){clearTimeout(tSave[key]);tSave[key]=setTimeout(async()=>{await fn();flash()},ms)}
  // ---- segédek ----
  const stepsOn=d=>steps[d]&&isNum(steps[d].n)?steps[d].n:null;
  const gymDone=d=>(workouts[d]?.items||[]).some(x=>x.done);
  const danceMin=d=>(dances[d]?.items||[]).reduce((a,x)=>a+(x.min||0),0);
  function setsOf(it){
    if(Array.isArray(it.setsArr)&&it.setsArr.length) return it.setsArr.map(s=>({reps:isNum(s.reps)?s.reps:null,kg:isNum(s.kg)?s.kg:null,done:!!s.done}));
    const n=isNum(it.sets)&&it.sets>0?it.sets:1; return Array.from({length:n},()=>({reps:isNum(it.reps)?it.reps:null,kg:isNum(it.kg)?it.kg:null,done:!!it.done}));
  }
  function toItem(f){const ss=f.sets.map(s=>{const o={done:!!s.done};if(isNum(s.reps))o.reps=s.reps;if(isNum(s.kg))o.kg=s.kg;return o});
    const o={ex:f.ex.trim(),done:ss.some(s=>s.done),sets:ss.length,setsArr:ss};const r=ss.find(s=>isNum(s.reps));if(r)o.reps=r.reps;
    const mk=Math.max(0,...ss.filter(s=>isNum(s.kg)).map(s=>s.kg));if(mk>0)o.kg=mk;if(isNum(f.rir))o.rir=f.rir;return o}
  function lastDone(name,before){const n=norm(name);
    const ds=Object.keys(workouts).filter(d=>d<before).sort().reverse();
    for(const d of ds){const it=(workouts[d].items||[]).find(x=>norm(x.ex)===n&&x.done);if(it)return {date:d,...it}}return null}
  const stepFor=kg=>kg>=40?5:2.5;
  function prefill(name){
    const pv=lastDone(name,sel), pi=P.item(name);
    if(pi&&(!pv||pv.date<P.startOf(prog))) return {ex:name,rir:null,sets:Array.from({length:pi.sets},()=>({reps:pi.reps,kg:isNum(pi.start)?pi.start:null,done:false}))};
    if(!pv) return {ex:name,rir:null,sets:[0,1,2].map(()=>({reps:null,kg:null,done:false}))};
    let ss=setsOf(pv).map(s=>({...s,done:false}));
    if(isNum(pv.rir)){if(pv.rir>=2)ss.forEach(s=>{if(isNum(s.kg)&&s.kg>0)s.kg+=stepFor(s.kg)});else if(pv.rir===1)ss.forEach(s=>{if(isNum(s.reps)&&s.reps<(pi?pi.reps+2:15))s.reps+=1})}
    if(pi&&ss.length!==pi.sets){const l=ss[ss.length-1];ss=Array.from({length:pi.sets},(_,k)=>ss[k]||{...l,done:false})}
    return {ex:name,rir:null,sets:ss};
  }
  function summ(it){const ss=setsOf(it).filter(s=>s.done);if(!ss.length)return '';
    const kg=Math.max(0,...ss.map(s=>s.kg||0));return `${ss.map(s=>s.reps??'?').join('/')} ism.${kg?' · '+kgTxt(kg)+' kg':''}`}

  // ---- fejléc, hét, terv ----
  const ICON={gym:'🏋️',dance:'💃',walk:'🚶',rest:'☕'}, COL={gym:'var(--gym)',dance:'var(--dance)',walk:'var(--steps)',rest:'var(--muted)'};
  function renderHead(){
    const d=toD(sel), t=iso(today());
    $('dn').textContent=sel===t?'Ma':sel===iso(addDays(today(),-1))?'Tegnap':DN[d.getDay()];
    $('dd').textContent=`${sel===t||sel===iso(addDays(today(),-1))?DN[d.getDay()]+', ':''}${HU[d.getMonth()]} ${d.getDate()}.`;
    $('tod').hidden=sel===t;
    const mon=mondayOf(d);
    $('strip').innerHTML=[0,1,2,3,4,5,6].map(k=>{const x=iso(addDays(mon,k)), dp=P.dayPlan(x,prog), n=stepsOn(x);
      const dots=(gymDone(x)?'<i style="background:var(--gym)"></i>':'')+(danceMin(x)?'<i style="background:var(--dance)"></i>':'')+(n!=null&&n>=dp.target?'<i style="background:var(--steps)"></i>':'');
      return `<button class="sd ${x===sel?'sel':''} ${x===t?'today':''}" data-d="${x}"><span class="a">${DS[k]}</span><span class="b">${toD(x).getDate()}</span><span class="dots">${dots}</span></button>`}).join('');
    const dp=P.dayPlan(sel,prog);
    $('plan').style.setProperty('--c',COL[dp.type]); $('plan').style.setProperty('--tint',`color-mix(in srgb,${COL[dp.type]} 12%,var(--surface))`);
    $('plan').innerHTML=`<span class="ic">${ICON[dp.type]}</span><span><b>${dp.label}${dp.workout?' – '+dp.workout.focus.toLowerCase():''}</b><span class="s">${dp.sub[0].toUpperCase()+dp.sub.slice(1)}${dp.week?' · '+dp.week+'. hét':''}</span></span>`;
  }
  $('strip').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b)go(b.dataset.d)});
  $('prev').onclick=()=>go(iso(addDays(toD(sel),-1)));
  $('next').onclick=()=>go(iso(addDays(toD(sel),1)));
  $('tod').onclick=()=>go(iso(today()));
  function go(d){Object.values(tSave).forEach(clearTimeout);commitPending();sel=d;loadDay();renderAll()}
  function commitPending(){ /* függő mentések azonnal */ if(pend.w){pend.w=false;const d=pend.wd,items=pend.wi;items.length?db.doc('workouts/'+d).set({date:d,items}):db.doc('workouts/'+d).delete()} if(pend.d){pend.d=false;const d=pend.dd,items=pend.di;items.length?db.doc('dance/'+d).set({date:d,items}):db.doc('dance/'+d).delete()} if(pend.s){pend.s=false;pend.sf()} }
  const pend={};

  // ---- lépés ----
  function renderSteps(){
    const dp=P.dayPlan(sel,prog), n=stepsOn(sel);
    if(document.activeElement!==$('stin')) $('stin').value=n??'';
    const v=n||0;
    $('stof').textContent=`/ ${nf(dp.target)}${dp.plusDance?' + tánc':''}`;
    $('stbar').style.width=Math.min(100,v/dp.target*100)+'%';
    $('stmeta').textContent=v>=dp.target?'✓ megvan a cél':v?`még ${nf(dp.target-v)}`:'';
  }
  $('stin').addEventListener('input',()=>{
    const raw=$('stin').value.trim(), d=sel, v=parseInt(raw,10);
    const fn=()=>raw===''?(steps[d]?db.doc('steps/'+d).delete():Promise.resolve()):(v>=0&&v<=80000?db.doc('steps/'+d).set({date:d,n:v}):Promise.resolve());
    pend.s=true; pend.sf=fn;
    const dp=P.dayPlan(sel,prog); $('stbar').style.width=Math.min(100,(v||0)/dp.target*100)+'%';
    later('s',async()=>{pend.s=false;await fn()},700);
  });

  // ---- tánc ----
  const DKIND={ora:'Óra',buli:'Buli'}, DSUB={technika:'Technika',gyakorlas:'Gyakorlás'};
  function renderDance(){
    $('dlist').innerHTML=dz.length?dz.map((x,i)=>`<div class="dz" data-i="${i}">
      <div class="r"><span class="row"><span class="seg">${Object.entries(DKIND).map(([k,l])=>`<button data-kind="${k}" aria-pressed="${x.kind===k}">${l}</button>`).join('')}</span>
        ${x.kind==='ora'?`<span class="seg">${Object.entries(DSUB).map(([k,l])=>`<button data-sub="${k}" aria-pressed="${x.sub===k}">${l}</button>`).join('')}</span>`:''}</span>
        <button class="x" data-xd aria-label="Tánc törlése">✕</button></div>
      <div class="r"><span class="stepper"><button data-dur="-15" aria-label="15 perccel kevesebb">−</button><b>${hm(x.min)}</b><button data-dur="15" aria-label="15 perccel több">+</button></span>
        <span class="ints"><small>Intenzitás</small>${[1,2,3,4,5].map(v=>`<button data-int="${v}" class="${v<=x.intensity?'on':''}" aria-label="Intenzitás ${v}">${v}</button>`).join('')}</span></div>
      <input class="note" data-note value="${esc(x.note||'')}" placeholder="Hol? (nem kötelező)">
    </div>`).join(''):'<div class="empty">Még nincs beírva tánc erre a napra.</div>';
    const m=dz.reduce((a,x)=>a+x.min,0); $('dmeta').textContent=m?hm(m)+' óra':'';
    const dp=P.dayPlan(sel,prog); $('dadd').textContent=!dz.length&&dp.dance?`+ ${dp.label} beírása`:'+ Tánc hozzáadása';
  }
  function dChanged(){pend.d=true;pend.dd=sel;pend.di=dz.map(x=>{const o={kind:x.kind,min:x.min,intensity:x.intensity};if(x.kind==='ora')o.sub=x.sub||'technika';if(x.note&&x.note.trim())o.note=x.note.trim();return o});
    later('d',async()=>{pend.d=false;const d=pend.dd,items=pend.di;await (items.length?db.doc('dance/'+d).set({date:d,items}):(dances[d]?db.doc('dance/'+d).delete():null))})}
  $('dadd').onclick=()=>{const dp=P.dayPlan(sel,prog);dz.push({kind:'ora',sub:'technika',min:dz.length?90:(dp.dance||90),intensity:3,note:''});renderDance();dChanged()};
  $('dlist').addEventListener('click',e=>{const c=e.target.closest('.dz');if(!c)return;const x=dz[+c.dataset.i],b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-xd'))dz.splice(+c.dataset.i,1);
    else if(b.dataset.kind){x.kind=b.dataset.kind;x.sub=x.kind==='ora'?(x.sub||'technika'):null}
    else if(b.dataset.sub)x.sub=b.dataset.sub;
    else if(b.dataset.dur)x.min=Math.max(15,Math.min(600,x.min+ +b.dataset.dur));
    else if(b.dataset.int)x.intensity=+b.dataset.int; else return;
    renderDance();dChanged()});
  $('dlist').addEventListener('input',e=>{if(!e.target.hasAttribute('data-note'))return;dz[+e.target.closest('.dz').dataset.i].note=e.target.value;dChanged()});

  // ---- edzés ----
  function wChanged(){pend.w=true;pend.wd=sel;pend.wi=ex.filter(x=>norm(x.ex)).map(toItem);
    later('w',async()=>{pend.w=false;const d=pend.wd,items=pend.wi;await (items.length?db.doc('workouts/'+d).set({date:d,items}):(workouts[d]?db.doc('workouts/'+d).delete():null))})}
  function exHTML(x,i){
    const pv=lastDone(x.ex,sel), dn=x.sets.filter(s=>s.done).length;
    return `<div class="ex" data-i="${i}">
      <div class="hd"><b>${esc(x.ex)}</b><span class="cnt ${dn&&dn===x.sets.length?'all':''}">${dn}/${x.sets.length}</span><button class="x" data-xe aria-label="Gyakorlat törlése">✕</button></div>
      <div class="prev">${pv?`Legutóbb (${HUs[toD(pv.date).getMonth()]} ${toD(pv.date).getDate()}.): ${summ(pv)}${isNum(pv.rir)?' · RIR '+pv.rir:''}`:P.item(x.ex)?'Első alkalom – a terv kezdősúlyával':'Első alkalom'}</div>
      ${x.sets.map((s,j)=>`<div class="set ${s.done?'done':''}" data-s="${j}"><span class="n">${j+1}.</span>
        <label><input type="number" inputmode="decimal" step="0.25" min="0" data-f="kg" value="${isNum(s.kg)?s.kg:''}" placeholder="–" aria-label="${j+1}. széria súly"><span>kg</span></label><span class="mul">×</span>
        <label><input type="number" inputmode="numeric" step="1" min="0" data-f="reps" value="${isNum(s.reps)?s.reps:''}" placeholder="–" aria-label="${j+1}. széria ismétlés"><span>ism.</span></label>
        <button class="chk" data-chk aria-pressed="${s.done}" aria-label="${j+1}. széria kész">✓</button></div>`).join('')}
      <div class="ft"><button class="s" data-add>+ széria</button>${x.sets.length>1?'<button class="s" data-rm>− széria</button>':''}
        <label class="rir">RIR <input type="number" inputmode="numeric" min="-3" max="10" data-rir value="${isNum(x.rir)?x.rir:''}" placeholder="–"></label></div>
    </div>`;
  }
  function renderGym(){
    const dp=P.dayPlan(sel,prog);
    $('tpls').hidden=ex.length>0;
    $('tpls').innerHTML=Object.values(P.WORKOUTS).map(w=>`<button class="tpl ${dp.gym===w.key?'rec':''}" data-tpl="${w.key}"><b>${w.name}</b><span>${w.focus} · ${(templates[w.key]||[]).length} gyakorlat</span></button>`).join('');
    $('exlist').innerHTML=ex.map(exHTML).join('');
    const all=new Map(); [...Object.values(P.WORKOUTS).flatMap(w=>[...w.items,...w.extra].map(i=>i.ex)),...Object.values(workouts).flatMap(w=>(w.items||[]).map(i=>i.ex))].forEach(n=>{if(n&&!all.has(norm(n)))all.set(norm(n),n.trim())});
    const have=new Set(ex.map(x=>norm(x.ex)));
    $('addex').innerHTML=`<option value="">+ ${ex.length?'Gyakorlat hozzáadása':'Egyedi gyakorlat'}…</option>`+[...all.values()].filter(n=>!have.has(norm(n))).sort((a,b)=>a.localeCompare(b,'hu')).map(n=>`<option>${esc(n)}</option>`).join('')+'<option value="__new">Új gyakorlat…</option>';
    const done=ex.filter(x=>x.sets.some(s=>s.done)).length, ss=ex.reduce((a,x)=>a+x.sets.length,0), sd=ex.reduce((a,x)=>a+x.sets.filter(s=>s.done).length,0);
    $('gmeta').textContent=ex.length?`${sd}/${ss} széria`:'';
  }
  function refreshEx(card){const x=ex[+card.dataset.i];card.outerHTML=exHTML(x,+card.dataset.i);const ss=ex.reduce((a,x)=>a+x.sets.length,0),sd=ex.reduce((a,x)=>a+x.sets.filter(s=>s.done).length,0);$('gmeta').textContent=`${sd}/${ss} széria`}
  $('tpls').addEventListener('click',e=>{const b=e.target.closest('[data-tpl]');if(!b)return;ex=(templates[b.dataset.tpl]||[]).map(prefill);renderGym();wChanged()});
  $('addex').addEventListener('change',e=>{let v=e.target.value;e.target.value='';if(!v)return;
    if(v==='__new'){v=(prompt('A gyakorlat neve:')||'').trim();if(!v)return}
    ex.push(prefill(v));renderGym();wChanged();$('exlist').lastElementChild?.scrollIntoView({behavior:'smooth',block:'center'})});
  $('exlist').addEventListener('click',e=>{const c=e.target.closest('.ex');if(!c)return;const i=+c.dataset.i,x=ex[i];
    if(e.target.closest('[data-xe]')){ex.splice(i,1);renderGym();wChanged();return}
    const ck=e.target.closest('[data-chk]');if(ck){const s=x.sets[+ck.closest('.set').dataset.s];s.done=!s.done;refreshEx(c);renderHead();wChanged();return}
    if(e.target.closest('[data-add]')){const l=x.sets[x.sets.length-1]||{};x.sets.push({reps:l.reps??null,kg:l.kg??null,done:false});refreshEx(c);wChanged();return}
    if(e.target.closest('[data-rm]')){if(x.sets.length>1)x.sets.pop();refreshEx(c);wChanged()}});
  $('exlist').addEventListener('input',e=>{const c=e.target.closest('.ex');if(!c)return;const x=ex[+c.dataset.i];
    if(e.target.hasAttribute('data-rir')){x.rir=numOr(e.target.value);wChanged();return}
    const f=e.target.dataset.f;if(!f)return;const j=+e.target.closest('.set').dataset.s,old=x.sets[j][f],nv=numOr(e.target.value);x.sets[j][f]=nv;
    for(let k=j+1;k<x.sets.length;k++){const s=x.sets[k];if(s.done)break;if(s[f]===old||s[f]==null){s[f]=nv;const inp=c.querySelector(`.set[data-s="${k}"] [data-f="${f}"]`);if(inp)inp.value=isNum(nv)?nv:''}else break}
    wChanged()});

  // ---- betöltés ----
  function loadDay(){
    ex=(workouts[sel]?.items||[]).map(x=>({ex:x.ex||'',rir:isNum(x.rir)?x.rir:null,sets:setsOf(x)}));
    dz=(dances[sel]?.items||[]).map(x=>({kind:x.kind==='buli'?'buli':'ora',sub:x.kind==='buli'?null:(x.sub||'technika'),min:x.min||90,intensity:x.intensity||3,note:x.note||''}));
  }
  function renderAll(){renderHead();renderSteps();renderDance();renderGym()}
  const docsMap=s=>{const o={};s.docs.map(d=>d.data()).filter(x=>x&&x.date).forEach(x=>o[x.date]=x);return o};
  db.collection('steps').onSnapshot(s=>{steps=docsMap(s);renderHead();renderSteps()});
  db.collection('workouts').onSnapshot(s=>{workouts=docsMap(s);if(!pend.w&&!document.activeElement?.closest?.('.ex')){loadDay();renderGym()}renderHead()});
  db.collection('dance').onSnapshot(s=>{dances=docsMap(s);if(!pend.d&&!document.activeElement?.closest?.('.dz')){dz=(dances[sel]?.items||[]).map(x=>({kind:x.kind==='buli'?'buli':'ora',sub:x.kind==='buli'?null:(x.sub||'technika'),min:x.min||90,intensity:x.intensity||3,note:x.note||''}));renderDance()}renderHead()});
  db.doc('settings/program').onSnapshot(s=>{prog=s.exists?s.data():{};renderAll()});
  db.doc('settings/templates').onSnapshot(s=>{if(s.exists){const d=s.data();templates={...P.templates(),...(d.a&&d.b?{a:d.a,b:d.b}:{})};renderGym()}});
  addEventListener('pagehide',commitPending);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)commitPending();else renderAll()});

  // mélylinkek: ?tpl=a, #tanc
  loadDay(); renderAll();
  setTimeout(()=>{const t=q.get('tpl');
    if(t&&P.WORKOUTS[t]&&!ex.length){ex=(templates[t]||[]).map(prefill);renderGym();wChanged()}
    if(location.hash==='#tanc'&&!dz.length)$('dadd').click();
    if(location.hash==='#szinkron'){$('syncdetails').open=true;$('syncdetails').scrollIntoView()}
    if(t||location.hash||q.get('d'))history.replaceState(null,'',location.pathname)},150);
})();
</script>
<script>
(function(){
  const $=id=>document.getElementById(id), L=window.LocalDB, c=L.cfg();
  $('s-url').value=c.url||''; $('s-token').value=c.token||'';
  $('s-save').onclick=()=>{const url=$('s-url').value.trim();
    if(url&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)){$('syncinfo').textContent='A cím így nézzen ki: https://script.google.com/macros/s/…/exec';return}
    L.setCfg(url?{url,token:$('s-token').value}:{})};
  $('s-now').onclick=()=>L.sync();
  $('s-off').onclick=()=>{L.setCfg({});$('s-url').value='';$('s-token').value='';L.status()};
  $('b-down').onclick=()=>L.download();
  $('b-up').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;
    try{L.importObj(JSON.parse(await f.text()));$('backupmsg').textContent='Visszatöltve.'}catch(e){$('backupmsg').textContent=e.message||'Nem sikerült beolvasni a fájlt.'}ev.target.value=''};
  L.status();
})();
</script>
<script src="nav.js"></script>
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
